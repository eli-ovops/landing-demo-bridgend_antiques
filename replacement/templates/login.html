{% extends 'base.html' %}{% block content %}<section class="reading"><h1>{{'Create your operator account' if setup else 'Shop sign-in'}}</h1>{% if setup %}<p>Local initial setup. Choose your own password of at least 14 characters.</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Username<input name="username" required minlength="3" maxlength="64" autocomplete="username"></label><label>Password<input name="password" type="password" required {% if setup %}minlength="14"{% endif %} maxlength="256" autocomplete="{{'new-password' if setup else 'current-password'}}"></label>{% if setup %}<label>Confirm password<input name="confirm" type="password" required minlength="14" autocomplete="new-password"></label>{% endif %}<button>{{'Create account' if setup else 'Sign in'}}</button></form></section>{% endblock %}
