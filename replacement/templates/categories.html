{% extends 'base.html' %}{% block content %}<p><a href="/admin">← Shop management</a></p><h1>Categories</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>New category<input name="name" required minlength="2" maxlength="100"></label><button>Add category</button></form>{% for c in categories %}<form method="post" class="filters"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="id" value="{{c.id}}"><label>Category {{c.id}}<input name="name" value="{{c.name}}" required minlength="2" maxlength="100"></label><label class="check"><input name="archived" type="checkbox" value="1" {% if c.archived %}checked{% endif %}>Hide from browse filters</label><button>Save category</button></form>{% endfor %}{% endblock %}
